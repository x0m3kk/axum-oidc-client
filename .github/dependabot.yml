version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/examples/api-server"
      - "/examples/www-server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo-major:
        patterns:
          - "*"
        update-types:
          - major
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
